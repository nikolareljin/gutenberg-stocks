name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    uses: nikolareljin/ci-helpers/.github/workflows/react.yml@production
    with:
      concurrency_key: frontend
      node_version: '24'
      install_command: 'npm install --no-audit --no-fund'
      lint_command: 'npm run lint && npm audit --audit-level=high'
      test_command: 'npm test -- --ci'
      build_command: 'npm run build'

  php-lint:
    uses: nikolareljin/ci-helpers/.github/workflows/php.yml@production
    with:
      concurrency_key: php-lint
      php_version: '8.2'
      install_command: 'composer install --no-interaction --prefer-dist'
      lint_command: 'vendor/bin/phpcs -p -s .'
      test_command: ''
      build_command: ''
