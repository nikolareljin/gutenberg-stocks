name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  frontend:
    uses: nikolareljin/ci-helpers/.github/workflows/node.yml@production
    with:
      concurrency_key: frontend
      node_version: '20'
      lint_command: 'npm ci && npm audit --audit-level=high'
      test_command: 'npm test'
      build_command: 'npm run build'

  php-syntax:
    uses: nikolareljin/ci-helpers/.github/workflows/php.yml@production
    with:
      concurrency_key: php-syntax
      php_version: '8.2'
      lint_command: "find . -type f -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -print0 | xargs -0 -n 1 php -l"
      test_command: ''
