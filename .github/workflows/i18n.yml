name: I18N POT

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-pot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate POT file
        # Same generator as local development (bin/make-pot.sh): identical
        # flags plus header normalization, so the bot only proposes PRs
        # for real string changes instead of every run.
        run: bash bin/make-pot.sh

      - name: Upload POT artifact
        uses: actions/upload-artifact@v4
        with:
          name: i18n-pot
          path: languages/nr-stocks.pot

      - name: Create POT update PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(i18n): update POT"
          title: "Update POT for translations"
          body: "Automated POT regeneration via CI."
          branch: chore/update-pot
          add-paths: |
            languages/nr-stocks.pot
