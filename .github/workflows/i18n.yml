name: I18N POT

on:
  push:
    branches: [master]
    paths:
      - 'inc/**'
      - 'src/**'
      - 'nr-stocks.php'
      - 'bin/make-pot.sh'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-pot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate POT file
        # Same generator as local development. The output has no line
        # references or volatile headers, so only string changes differ.
        run: bash bin/make-pot.sh

      - name: Upload POT artifact
        uses: actions/upload-artifact@v4
        with:
          name: i18n-pot
          path: languages/nr-stocks.pot

      - name: Create POT update PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: "chore(i18n): update POT"
          title: "Update POT for translations"
          body: "Automated POT regeneration via CI."
          branch: chore/update-pot
          add-paths: |
            languages/nr-stocks.pot
