name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to release (for example, 0.1.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: nikolareljin/ci-helpers/.github/workflows/create-github-release.yml@production
    with:
      release_tag: ${{ inputs.release_tag }}
